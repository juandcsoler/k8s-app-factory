{{- if .Values.rbac.helpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "k8s-app-factory.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "k8s-app-factory.resourceName" (dict "suffix" "coreapp-admin-role" "context" $) }}
rules:
- apiGroups:
  - platform.juandc.dev
  resources:
  - coreapps
  verbs:
  - '*'
- apiGroups:
  - platform.juandc.dev
  resources:
  - coreapps/status
  verbs:
  - get
{{- end }}
