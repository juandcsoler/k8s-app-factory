name: Release to ECR

on:
  push:
    tags:
      - 'v*' # Triggers when a new tag is pushed (e.g. v0.1.0)

# Required permissions for OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

env:
  # It is a best practice to keep AWS Region and Repository names as repository variables,
  # and the Role ARN as a GitHub Secret.
  AWS_REGION: ${{ vars.AWS_REGION }}               
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}        

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run Tests (Gatekeeper)
        run: make test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Generate Installer Bundle
        run: |
          make build-installer IMG=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}

      - name: Package and Push Helm Chart to ECR
        run: |
          # ECR supports OCI artifacts, so we can push Helm charts directly to it
          # First, update the chart version to match the git tag (removing the 'v' prefix)
          VERSION=${GITHUB_REF_NAME#v}
          helm package dist/chart --version $VERSION --app-version $VERSION
          
          # Login Helm to ECR (using the token from the aws-actions/amazon-ecr-login step)
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | helm registry login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          
          # Push the chart via OCI
          helm push k8s-app-factory-${VERSION}.tgz oci://${{ steps.login-ecr.outputs.registry }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: install.yaml
          path: dist/install.yaml

