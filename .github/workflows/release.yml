name: Release to ECR

on:
  push:
    tags:
      - 'v*' # Triggers when a new tag is pushed (e.g. v0.1.0)

# Required permissions for OIDC authentication with AWS and creating GitHub Releases
permissions:
  id-token: write
  contents: write

env:
  # It is a best practice to keep AWS Region and Repository names as repository variables,
  # and the Role ARN as a GitHub Secret.
  AWS_REGION: ${{ vars.AWS_REGION }}               
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  ECR_IMAGE_REPOSITORY: ${{ vars.ECR_IMAGE_REPOSITORY }} # e.g., platform-k8s-core-operator-controller
  ECR_CHART_REGISTRY_PATH: ${{ vars.ECR_CHART_REGISTRY_PATH }} # Optional prefix, e.g., "charts" if your repo is "charts/platform-k8s-core-operator". Leave empty for root.        

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run Tests (Gatekeeper)
        run: make test

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_IMAGE_REPOSITORY }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Generate Installer Bundle
        run: |
          make build-installer IMG=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_IMAGE_REPOSITORY }}:${{ github.ref_name }}

      - name: Package and Push Helm Chart to ECR
        run: |
          # ECR supports OCI artifacts, so we can push Helm charts directly to it
          # First, update the chart version to match the git tag (removing the 'v' prefix)
          VERSION=${GITHUB_REF_NAME#v}
          echo "CHART_VERSION=$VERSION" >> $GITHUB_ENV
          
          # Inject the real AWS ECR image into the Helm chart's values.yaml
          REGISTRY=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_IMAGE_REPOSITORY }}
          yq e -i ".manager.image.repository = \"$REGISTRY\"" dist/chart/values.yaml
          yq e -i ".manager.image.tag = \"${{ github.ref_name }}\"" dist/chart/values.yaml
          
          helm package dist/chart --version $VERSION --app-version $VERSION
          
          # Login Helm to ECR (using the token from the aws-actions/amazon-ecr-login step)
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | helm registry login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          
          # Push the chart via OCI (Helm will automatically append the chart name 'platform-k8s-core-operator' to this URL)
          # If ECR_CHART_REGISTRY_PATH is empty, it pushes to /platform-k8s-core-operator
          # If ECR_CHART_REGISTRY_PATH is 'charts', it pushes to /charts/platform-k8s-core-operator
          helm push platform-k8s-core-operator-${VERSION}.tgz oci://${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_CHART_REGISTRY_PATH }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: install.yaml
          path: dist/install.yaml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/install.yaml
            platform-k8s-core-operator-${{ env.CHART_VERSION }}.tgz

