apiVersion: platform.juandc.dev/v1alpha1
kind: CoreApp
metadata:
  name: coreapp-invalid-replicas
  namespace: default
spec:
  image: nginx:latest
  port: 80
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  autoscaling:
    minReplicas: 5  # <-- ERROR: minReplicas (5) is greater than maxReplicas (2)
    maxReplicas: 2
