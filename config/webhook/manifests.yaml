---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-platform-juandc-dev-v1alpha1-coreapp
  failurePolicy: Fail
  name: vcoreapp-v1alpha1.kb.io
  rules:
  - apiGroups:
    - platform.juandc.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - coreapps
  sideEffects: None
