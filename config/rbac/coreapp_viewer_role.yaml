# This rule is not used by the project platform-k8s-core-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to platform.juandc.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: platform-k8s-core-operator
    app.kubernetes.io/managed-by: kustomize
  name: coreapp-viewer-role
rules:
- apiGroups:
  - platform.juandc.dev
  resources:
  - coreapps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.juandc.dev
  resources:
  - coreapps/status
  verbs:
  - get
