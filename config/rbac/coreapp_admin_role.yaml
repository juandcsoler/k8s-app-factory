# This rule is not used by the project platform-k8s-core-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over platform.juandc.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: platform-k8s-core-operator
    app.kubernetes.io/managed-by: kustomize
  name: coreapp-admin-role
rules:
- apiGroups:
  - platform.juandc.dev
  resources:
  - coreapps
  verbs:
  - '*'
- apiGroups:
  - platform.juandc.dev
  resources:
  - coreapps/status
  verbs:
  - get
